[project]
name = "renater-partage-mcp"
version = "0.1.0"
description = "MCP connector for Renater partage mailboxes (IMAP/SMTP)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "imap-tools>=1.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
renater-partage-mcp = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
